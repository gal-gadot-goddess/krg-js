name: Daily 3D Three.js Reel Generator & Publisher

on:
  schedule:
    - cron: '0 5,12,18 * * *'  # Runs 3 times daily: 5:00 AM, 12:00 PM, 6:00 PM UTC
  workflow_dispatch:          # Allows manual trigger anytime with 1-click

permissions:
  contents: write

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Daily 3D Reel Generator & Meta Publisher
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_daily_reel.py --duration 12 --fps 60 --publish

      - name: Sync History to GitHub
        run: |
          git config --global user.name 'kreggsjs-bot'
          git config --global user.email 'bot@kreggsjs.com'
          git add history.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: record daily 3D reel run [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin HEAD:main
          fi
