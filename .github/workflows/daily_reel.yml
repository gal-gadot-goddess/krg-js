name: Daily Autonomous JS Reel Generator

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 AM UTC (3:30 PM IST)
  workflow_dispatch:      # Allows manual trigger anytime with 1-click

permissions:
  contents: write

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64

      - name: Install Node Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Reel Generator & Publisher
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node daily_reel_runner.js

      - name: Sync History to GitHub
        run: |
          git config --global user.name 'kreggsjs-bot'
          git config --global user.email 'bot@kreggsjs.com'
          git add history.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: record daily reel run [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin HEAD:main
          fi
