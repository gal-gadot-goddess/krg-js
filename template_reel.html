<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>3D Three.js 60 FPS Cinematic Reel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background-color: #030208;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    position: relative;
    user-select: none;
  }
  
  /* Full-bleed 1080x1920 3D WebGL Canvas Layer */
  #webglContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1920px;
    z-index: 1;
    background: radial-gradient(circle at 50% 50%, #080918 0%, #030208 100%);
    overflow: hidden;
  }
  #webglContainer canvas {
    width: 1080px !important;
    height: 1920px !important;
    display: block;
  }

  /* Dynamic ambient glowing neon orbs */
  .glow-orb-1 {
    position: absolute;
    width: 900px;
    height: 900px;
    top: -200px;
    left: -200px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
    filter: blur(140px);
    pointer-events: none;
    z-index: 2;
    transition: background 0.8s ease;
  }
  .glow-orb-2 {
    position: absolute;
    width: 950px;
    height: 950px;
    bottom: -200px;
    right: -200px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, transparent 70%);
    filter: blur(140px);
    pointer-events: none;
    z-index: 2;
    transition: background 0.8s ease;
  }

  /* Cinematic Vignette Overlay */
  .vignette-overlay {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(2, 2, 6, 0.65) 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* UI HUD Layer */
  .hud-layer {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 48px;
    z-index: 10;
    pointer-events: none;
  }

  /* Top HUD Section */
  .top-hud {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge-live {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(56, 189, 248, 0.35);
    backdrop-filter: blur(16px);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #38bdf8;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
  }
  .pulse-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 16px #ef4444;
    animation: livePulse 1.4s infinite;
  }
  @keyframes livePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .category-pill {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #cbd5e1;
    background: rgba(15, 23, 42, 0.75);
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
  }

  /* Hero Title with Neon Glow */
  .hero-title-box {
    margin-top: 8px;
  }
  .hero-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #38bdf8 45%, #c084fc 80%, #f43f5e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.9));
  }
  .hero-subtitle {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #94a3b8;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .fps-pill {
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 18px;
  }

  /* Bottom HUD Section */
  .bottom-hud {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Floating Glass Code Card */
  .code-glass-card {
    width: 100%;
    background: rgba(6, 10, 24, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 26px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px rgba(56, 189, 248, 0.18);
    backdrop-filter: blur(24px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .code-titlebar {
    height: 52px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    padding: 0 24px;
    position: relative;
    justify-content: space-between;
  }
  .window-dots {
    display: flex;
    gap: 10px;
  }
  .window-dots div {
    width: 14px;
    height: 14px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }

  .editor-tab {
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 20px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .editor-tab .js-icon {
    color: #f7df1e;
    font-weight: 900;
  }
  .badge-tag {
    font-size: 17px;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Code Viewport */
  .code-body-wrapper {
    height: 240px;
    overflow: hidden;
    position: relative;
    padding: 20px 28px;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
  }
  .editor-body {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 21px;
    line-height: 1.5;
    color: #f1f5f9;
    white-space: pre;
    position: absolute;
    top: 20px;
    left: 28px;
    right: 28px;
    transition: transform 0.15s ease-out;
  }
  .line-num {
    color: #64748b;
    user-select: none;
    margin-right: 18px;
    display: inline-block;
    width: 28px;
    text-align: right;
  }
  .kw { color: #f43f5e; font-weight: 700; }
  .fn { color: #38bdf8; font-weight: 600; }
  .str { color: #a3e635; }
  .num { color: #fb923c; }
  .com { color: #94a3b8; font-style: italic; }
  .cursor {
    display: inline-block;
    width: 10px;
    height: 22px;
    background: #38bdf8;
    vertical-align: text-bottom;
    margin-left: 4px;
    box-shadow: 0 0 14px #38bdf8;
  }

  /* Footer bar */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #94a3b8;
    font-size: 21px;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .cta-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #f8fafc;
    background: rgba(15, 23, 42, 0.75);
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
  }
  .cta-badge span.bolt {
    color: #facc15;
    font-size: 24px;
  }
  .res-badge {
    background: rgba(15, 23, 42, 0.75);
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
    color: #e2e8f0;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <!-- Full Screen 3D WebGL Canvas Layer -->
  <div id="webglContainer"></div>

  <!-- Ambient Glow Orbs -->
  <div class="glow-orb-1" id="glowOrb1"></div>
  <div class="glow-orb-2" id="glowOrb2"></div>
  <div class="vignette-overlay"></div>

  <!-- Cinematic Floating Glass HUD -->
  <div class="hud-layer">
    <!-- Top HUD -->
    <div class="top-hud">
      <div class="header-bar">
        <div class="badge-live">
          <div class="pulse-dot"></div>
          <span>3D WEBGL LIVE ENGINE</span>
        </div>
        <div class="category-pill" id="categoryTag">ASTROPHYSICS & RELATIVITY</div>
      </div>
      <div class="hero-title-box">
        <h1 class="hero-title" id="mainTitle">Cosmic Singularity & Gargantua</h1>
        <div class="hero-subtitle">
          <span id="previewSubtitle">Relativistic Accretion Disk (Cosmic Violet)</span>
          <span class="fps-pill">60 FPS ULTRA HD</span>
        </div>
      </div>
    </div>

    <!-- Bottom HUD -->
    <div class="bottom-hud">
      <div class="code-glass-card">
        <div class="code-titlebar">
          <div class="window-dots">
            <div class="dot-red"></div>
            <div class="dot-yellow"></div>
            <div class="dot-green"></div>
          </div>
          <div class="editor-tab">
            <span class="js-icon">JS</span>
            <span id="tabFileName">black_hole.js</span>
          </div>
          <div class="badge-tag">LIVE THREE.JS COMPUTE</div>
        </div>
        <div class="code-body-wrapper">
          <div class="editor-body" id="editorBody"></div>
        </div>
      </div>

      <div class="footer-bar">
        <div class="cta-badge">
          <span class="bolt">⚡</span>
          <span>Follow @kreggsjs for daily 3D Code Art</span>
        </div>
        <div class="res-badge">1080×1920 • 60 FPS</div>
      </div>
    </div>
  </div>

  <!-- Three.js and core modules -->
  <script src="assets/three.min.js"></script>
  <script src="variations_engine.js"></script>

  <script>
    // State variables
    let currentVisualizer = null;
    let currentVariation = null;
    let threeScene = null, threeCamera = null, threeRenderer = null;
    let currentPlaybackTime = 0.0;
    let isRealtimeRunning = false;
    let lastRealtimeTimestamp = 0;

    const webglContainer = document.getElementById('webglContainer');
    const editorBody = document.getElementById('editorBody');

    // Syntax Highlighting Engine (Token-safe)
    function highlightSyntax(raw) {
      if (!raw) return '';
      // Escape HTML entities
      let text = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      
      // If full comment line
      if (/^\s*\/\//.test(text)) {
        return `<span class="com">${text}</span>`;
      }
      
      // Separate trailing comments
      let commentPart = '';
      const cIdx = text.indexOf('//');
      if (cIdx !== -1) {
        commentPart = `<span class="com">${text.substring(cIdx)}</span>`;
        text = text.substring(0, cIdx);
      }

      // Hide string literals with markers
      const strings = [];
      text = text.replace(/('.*?'|".*?"|`.*?`)/g, (m) => {
        strings.push(m);
        return `___STR${strings.length - 1}___`;
      });

      // Highlight keywords
      text = text.replace(/\b(function|const|let|var|return|if|else|new|for|while|class|import|from|export|default)\b/g, '<span class="kw">$1</span>');

      // Highlight function calls
      text = text.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g, '<span class="fn">$1</span>');

      // Highlight numeric constants
      text = text.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');

      // Restore string literals
      text = text.replace(/___STR(\d+)___/g, (_, idx) => `<span class="str">${strings[parseInt(idx, 10)]}</span>`);

      return text + commentPart;
    }

    // Initialize WebGL Three.js Renderer (Full 1080x1920 screen)
    function initThree() {
      if (threeRenderer) return;

      threeScene = new THREE.Scene();
      threeCamera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 1000);
      threeCamera.position.z = 18;

      threeRenderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      threeRenderer.setSize(1080, 1920);
      threeRenderer.setPixelRatio(1);
      threeRenderer.setClearColor(0x030208, 1);
      webglContainer.appendChild(threeRenderer.domElement);
    }

    function loadVisualizerModule(vizId, callback) {
      if (window.VISUALIZERS && window.VISUALIZERS[vizId]) {
        callback(window.VISUALIZERS[vizId]);
        return;
      }
      const s = document.createElement('script');
      s.src = `visualizers/${vizId}.js`;
      s.onload = () => {
        if (window.VISUALIZERS && window.VISUALIZERS[vizId]) {
          callback(window.VISUALIZERS[vizId]);
        } else {
          console.warn('Visualizer not found in window.VISUALIZERS:', vizId);
          callback(null);
        }
      };
      s.onerror = (e) => {
        console.error('Failed to load visualizer script:', vizId, e);
        callback(null);
      };
      document.head.appendChild(s);
    }

    // Set Active Visualization & Variation
    window.setVisualization = function(visualizerId, variationIndex = 0, onReady) {
      initThree();

      loadVisualizerModule(visualizerId, (viz) => {
        if (!viz) {
          console.error('Could not load visualizer:', visualizerId);
          return;
        }

        const variation = window.VariationsEngine.createVariation(viz.id, variationIndex);
        currentVisualizer = viz;
        currentVariation = variation;

        // Update DOM text
        document.getElementById('mainTitle').innerText = variation.title;
        document.getElementById('categoryTag').innerText = variation.category;
        document.getElementById('tabFileName').innerText = variation.fileName;
        document.getElementById('previewSubtitle').innerText = `${viz.title} (${variation.paletteName})`;

        // Dynamic ambient glow
        document.getElementById('glowOrb1').style.background = `radial-gradient(circle, ${variation.bgGlow} 0%, transparent 70%)`;

        // Initialize 3D scene with variation parameters
        viz.init(THREE, threeScene, threeCamera, threeRenderer, variation.params);

        // Enforce 1080x1920 aspect ratio
        threeCamera.aspect = 1080 / 1920;
        threeCamera.updateProjectionMatrix();
        threeRenderer.setSize(1080, 1920);

        // Seek to t = 0
        window.setSeekTime(0.0);

        window.__READY__ = true;
        if (typeof onReady === 'function') onReady();
      });
    };

    // Frame-Accurate Deterministic Seek Function
    window.setSeekTime = function(t) {
      if (!currentVisualizer || !currentVariation) return;
      currentPlaybackTime = t;

      // 1. Code auto-typing and auto-scrolling
      const fullCode = currentVariation.displayCode;
      const typingDuration = 6.0;
      const progress = Math.min(1.0, t / typingDuration);
      const charCount = Math.floor(fullCode.length * progress);
      const visibleText = fullCode.substring(0, charCount);

      const lines = visibleText.split('\n');
      let htmlLines = lines.map((ln, idx) => {
        const lineNum = '<span class="line-num">' + (idx + 1) + '</span>';
        return lineNum + highlightSyntax(ln);
      }).join('\n');

      htmlLines += '<span class="cursor"></span>';
      editorBody.innerHTML = htmlLines;

      const lineHeight = 31.5;
      const maxVisibleLines = 7;
      const currentLineCount = lines.length;

      if (currentLineCount > maxVisibleLines) {
        const overflow = currentLineCount - maxVisibleLines;
        const translateY = -(overflow * lineHeight);
        editorBody.style.transform = `translateY(${translateY}px)`;
      } else {
        editorBody.style.transform = 'translateY(0px)';
      }

      // 2. Render 3D Three.js frame
      currentVisualizer.render(THREE, threeScene, threeCamera, threeRenderer, t, currentVariation.params);
    };

    // Real-Time Playback Loop (for live browser viewing)
    function realtimeLoop(timestamp) {
      if (!isRealtimeRunning) return;
      if (!lastRealtimeTimestamp) lastRealtimeTimestamp = timestamp;

      const delta = (timestamp - lastRealtimeTimestamp) / 1000.0;
      lastRealtimeTimestamp = timestamp;

      currentPlaybackTime += delta;
      window.setSeekTime(currentPlaybackTime);

      requestAnimationFrame(realtimeLoop);
    }

    window.startRealtimePlayback = function() {
      if (isRealtimeRunning) return;
      isRealtimeRunning = true;
      lastRealtimeTimestamp = 0;
      requestAnimationFrame(realtimeLoop);
    };

    // Auto-parse URL query parameters (e.g. ?visualizer=calabi_yau_manifold&var=5)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const vizId = params.get('visualizer') || 'black_hole_gargantua';
      const varIdx = parseInt(params.get('var') || '0', 10);

      window.setVisualization(vizId, varIdx, () => {
        window.startRealtimePlayback();
      });
    });
  </script>
</body>
</html>
